<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient( #ff0000, #222120);
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 30px;
        }
        a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }
        a:hover {
            text-decoration: underline;
        }
      @media (max-width: 600px) {
            div {
                flex-direction: column;
            }
            button {
                margin: 10px 0;
            }
              .moon {
                display: block;
            position: absolute;
            top: 0;
            right: -300px;
            background: linear-gradient( #ff0808, #0026ff);
            display: flex;
            height: 100px;
            flex-direction: column;
            align-items: center;
            width: 300px;
            transition: left 0.3s ease;
            padding-top: 100px;
        }
        body.show-mobile--menu .moon {
            right: 0;
        }
        }
        .moon {
            flex: 1;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div>
        <button id="on">on</button>
        <button id="off">off</button>
        <div class="moon">
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Blog</a>
            <a href="">Contact</a>

        </div>

    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.slim.js" integrity="sha256-UgvvN8vBkgO0luPSUl2s8TIlOSYRoGFAX4jlCIm9Adc=" crossorigin="anonymous"></script>
    <script>
     
$(document).ready(function(){
    $("on").click (function(){
    $("moon").animate({
        left:'300px'
    });
    });
});
    </script>
</body>
</html>
